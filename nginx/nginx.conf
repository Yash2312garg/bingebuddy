# ============================================================
# BingeBuddy — NGINX API Gateway
# Single public port: 8080
# Routes:
#   /api/v1/notification  →  notification-service-dev:3001
#   /health               →  nginx health check (200 OK)
#   /                     →  app-dev:3000
# ============================================================

events {
    worker_connections 1024;
}

http {
    # --------------------------------------------------------
    # Logging  (structured JSON for easy log aggregation)
    # --------------------------------------------------------
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":"$status",'
            '"upstream":"$upstream_addr",'
            '"req_time":"$request_time",'
            '"bytes_sent":"$bytes_sent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log  warn;

    # --------------------------------------------------------
    # Sensible defaults
    # --------------------------------------------------------
    sendfile            on;
    keepalive_timeout   65;
    client_max_body_size 10m;

    # --------------------------------------------------------
    # Upstream blocks  (allows future load-balancing)
    # --------------------------------------------------------
    upstream main_app {
        server app-dev:3000;
        # For prod, swap to: server app-prod:3000;
        keepalive 32;
    }

    upstream notification_svc {
        server notification-service-dev:3001;
        # For prod, swap to: server notification-service-prod:3001;
        keepalive 16;
    }

    # --------------------------------------------------------
    # Server block
    # --------------------------------------------------------
    server {
        listen 8080;
        server_name _;

        # Shared proxy headers applied to every location
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
        proxy_http_version 1.1;

        # ---------------------------------------------------
        # GATEWAY HEALTH CHECK
        # Used by Docker healthcheck — returns 200 immediately
        # without hitting any upstream.
        # ---------------------------------------------------
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ---------------------------------------------------
        # ROUTE 1 — Notification Service
        # Handles both REST (POST/GET) and SSE streams.
        # ---------------------------------------------------
        location /api/v1/notification {
            proxy_pass http://notification_svc;

            # SSE / streaming  — must NOT buffer
            proxy_set_header Connection "";
            proxy_buffering          off;
            proxy_cache              off;
            proxy_read_timeout       3600s;   # keep SSE connections alive for 1 h
            chunked_transfer_encoding on;
        }

        # ---------------------------------------------------
        # ROUTE 2 — Main Application (catch-all)
        # ---------------------------------------------------
        location / {
            proxy_pass http://main_app;

            # WebSocket upgrade support (if needed)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
            proxy_connect_timeout 10s;
        }
    }
}