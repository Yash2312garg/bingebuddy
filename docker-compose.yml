# ============================================================
# BingeBuddy — Unified Backend Compose
# Services: main-app | notification-service | nginx gateway | rabbitmq
# Usage:
#   Dev:  docker compose up
#   Prod: docker compose --profile prod up
# ============================================================

name: bingebuddy

services:

  # ============================================================
  # NGINX API GATEWAY  (single public entry point — port 8080)
  # ============================================================
  gateway:
    image: nginx:1.27-alpine
    container_name: bingebuddy-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app-dev:
        condition: service_healthy
      notification-service-dev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bingebuddy-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # MESSAGE BROKER (RabbitMQ for inter-service communication)
  # ============================================================
  message-broker:
    image: rabbitmq:3-management-alpine
    container_name: bingebuddy-rabbitmq
    ports:
      - "15672:15672" # Management UI exposed to your Mac
    expose:
      - "5672"        # Internal AMQP port (hidden from Mac)
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bingebuddy-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # MAIN APP  — Development
  # ============================================================
  app-dev:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    container_name: bingebuddy-app-dev
    expose:
      - "3000"      # internal only — gateway handles public routing
    ports:
      - "${APP_DEBUG_PORT:-9229}:9229" # debugger
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      DOCKER_ENV: "true"
      DB_HOST: main-db
      DB_PORT: 5432
      REDIS_URL: redis://main-redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@message-broker:5672
      PORT: 3000
    volumes:
      - ./server/src:/usr/src/app/src:ro
      - ./server/package.json:/usr/src/app/package.json:ro
      - ./server/.env:/usr/src/app/.env:ro
    depends_on:
      main-db:
        condition: service_healthy
      main-redis:
        condition: service_started
      message-broker:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./server/src
          target: /usr/src/app/src
          ignore:
            - "**/*.test.*"
        - action: rebuild
          path: ./server/package.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: "1G"
          cpus: "0.5"
    networks:
      - bingebuddy-network

  # ============================================================
  # MAIN APP  — Production  (docker compose --profile prod up)
  # ============================================================
  app-prod:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    container_name: bingebuddy-app-prod
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DB_HOST: main-db
      DB_PORT: 5432
      REDIS_URL: redis://main-redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@message-broker:5672
      PORT: 3000
    env_file:
      - ./server/.env
    depends_on:
      main-db:
        condition: service_healthy
      main-redis:
        condition: service_started
      message-broker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: "${PROD_MEMORY_LIMIT:-2G}"
          cpus: "${PROD_CPU_LIMIT:-1.0}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - bingebuddy-network
    profiles:
      - prod

  # ============================================================
  # MAIN DB  (PostgreSQL — isolated for main app)
  # ============================================================
  main-db:
    build:
      context: ./server
      dockerfile: Dockerfile.db
    container_name: bingebuddy-main-db
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - main_postgres_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bingebuddy-network

  # ============================================================
  # MAIN REDIS  (isolated for main app)
  # ============================================================
  main-redis:
    build:
      context: ./server
      dockerfile: Dockerfile.redis
    container_name: bingebuddy-main-redis
    expose:
      - "6379"
    volumes:
      - main_redis_data:/data
    networks:
      - bingebuddy-network

  # ============================================================
  # NOTIFICATION SERVICE  — Development
  # ============================================================
  notification-service-dev:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
      target: development
    container_name: bingebuddy-notification-dev
    expose:
      - "3001"      # internal only — gateway routes /api/v1/notification here
    ports:
      - "${NOTIF_DEBUG_PORT:-9230}:9229" # debugger
    env_file:
      - ./notification-service/.env
    environment:
      NODE_ENV: development
      DOCKER_ENV: "true"
      DB_HOST: notification-db
      DB_PORT: 5432
      REDIS_URL: redis://notification-redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@message-broker:5672
      PORT: 3001
    volumes:
      - ./notification-service/src:/usr/src/app/src:ro
      - ./notification-service/package.json:/usr/src/app/package.json:ro
      - ./notification-service/.env:/usr/src/app/.env:ro
    depends_on:
      notification-db:
        condition: service_healthy
      notification-redis:
        condition: service_started
      message-broker:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./notification-service/src
          target: /usr/src/app/src
        - action: rebuild
          path: ./notification-service/package.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: "512M"
          cpus: "0.25"
    networks:
      - bingebuddy-network

  # ============================================================
  # NOTIFICATION SERVICE  — Production
  # ============================================================
  notification-service-prod:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
      target: production
    container_name: bingebuddy-notification-prod
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      DB_HOST: notification-db
      DB_PORT: 5432
      REDIS_URL: redis://notification-redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@message-broker:5672
      PORT: 3001
    env_file:
      - ./notification-service/.env
    depends_on:
      notification-db:
        condition: service_healthy
      notification-redis:
        condition: service_started
      message-broker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: "${NOTIF_MEMORY_LIMIT:-1G}"
          cpus: "${NOTIF_CPU_LIMIT:-0.5}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - bingebuddy-network
    profiles:
      - prod

  # ============================================================
  # NOTIFICATION DB  (PostgreSQL)
  # ============================================================
  notification-db:
    image: postgres:15-alpine
    container_name: bingebuddy-notification-db
    environment:
      POSTGRES_DB: "${NOTIF_POSTGRES_DB}"
      POSTGRES_USER: "${NOTIF_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${NOTIF_POSTGRES_PASSWORD}"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
      - ./notification-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-notifications}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bingebuddy-network

  # ============================================================
  # NOTIFICATION REDIS
  # ============================================================
  notification-redis:
    image: redis:7.2-alpine
    container_name: bingebuddy-notification-redis
    expose:
      - "6379"
    volumes:
      - notification_redis_data:/data
    networks:
      - bingebuddy-network

# ============================================================
# Named volumes
# ============================================================
volumes:
  main_postgres_data:
  main_redis_data:
  notification_postgres_data:
  notification_redis_data:
  rabbitmq_data:

# ============================================================
# Networks
# ============================================================
networks:
  bingebuddy-network:
    driver: bridge