# 1. DEFAULT INGRESS (Client, Server, Auth)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bingebuddy-ingress-default
  namespace: bingebuddy-dev
  labels:
    app.kubernetes.io/managed-by: argocd
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
spec:
  rules:
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3002
          - path: /restaurant
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 80
---
# 2. SSE INGRESS (Notification Service)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bingebuddy-ingress-sse
  namespace: bingebuddy-dev
  labels:
    app.kubernetes.io/managed-by: argocd
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    # SSE Tuning
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  rules:
      http:
        paths:
          - path: /api/v1/notification
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 3001
---
# 3. PROTECTED ROUTES INGRESS (Auth Bouncer)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bingebuddy-ingress-protected
  namespace: bingebuddy-dev
  labels:
    app.kubernetes.io/managed-by: argocd
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    # Auth Request configuration
    nginx.ingress.kubernetes.io/auth-url: "http://auth-service.bingebuddy-dev.svc.cluster.local:3002/auth/v1/restaurant/validate-session"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Session-Identifier, X-Session-Type, X-Session-Generated-At"
spec:
  rules:
      http:
        paths:
          - path: /restaurant/prelogin
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 3000
