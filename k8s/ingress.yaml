apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bingebuddy-ingress
  namespace: bingebuddy-dev
  labels:
    app.kubernetes.io/managed-by: argocd
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Required for regex paths — ImplementationSpecific pathType alone isn't enough
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Rewrite: strip the matched prefix before forwarding to backend
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  rules:
    - host: bingebuddy.local
      http:
        paths:
          # ── Auth Service ─────────────────────────────────────
          - path: /auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 3002

          # ── Notification Service ──────────────────────────────
          - path: /api/v1/notification(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: notification-service
                port:
                  number: 3001

          # ── Main App (API) ────────────────────────────────────
          # Must come after /api/v1/notification (more specific first)
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: server
                port:
                  number: 3000

          # ── React Client (SPA) ───────────────────────────────
          # Catch-all — must be last
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: client
                port:
                  number: 80

