apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: bingebuddy-dev
  labels:
    app: auth-service
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth-service
          # ⚠️ GitHub Actions CI updates this tag automatically
          image: ghcr.io/yash2312garg/bingebuddy-auth-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-secrets
          readinessProbe:
            httpGet:
              path: /auth/v1/health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /auth/v1/health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: bingebuddy-dev
  labels:
    app: auth-service
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 3002
      targetPort: 3002
      protocol: TCP
