apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: bingebuddy-dev
  labels:
    app: client
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: client
          # ⚠️ GitHub Actions CI updates this tag automatically
          # Production build served via nginx
          image: ghcr.io/yash2312garg/bingebuddy-client:e9b30d5
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          securityContext:
            runAsNonRoot: false   # nginx needs root to bind port 80
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: bingebuddy-dev
  labels:
    app: client
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  selector:
    app: client
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
