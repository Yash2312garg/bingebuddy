apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-postgres-ingress
  namespace: bingebuddy-dev
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app: server-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: server
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-postgres-ingress
  namespace: bingebuddy-dev
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app: auth-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth-service
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-postgres-ingress
  namespace: bingebuddy-dev
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app: notification-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: notification-service
        - podSelector:
            matchLabels:
              app: notification-partition-cron
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: bingebuddy-dev
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: server
        - podSelector:
            matchLabels:
              app: auth-service
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-ingress
  namespace: bingebuddy-dev
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: server
        - podSelector:
            matchLabels:
              app: auth-service
        - podSelector:
            matchLabels:
              app: notification-service
      ports:
        - protocol: TCP
          port: 5672
