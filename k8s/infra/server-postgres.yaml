apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-postgres
  namespace: bingebuddy-dev
  labels:
    app: server-postgres
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server-postgres
  template:
    metadata:
      labels:
        app: server-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: "bingebuddy"
            - name: POSTGRES_USER
              value: "yash"
            - name: POSTGRES_PASSWORD
              value: "Nishi@123"
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: server-postgres
  namespace: bingebuddy-dev
  labels:
    app: server-postgres
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  selector:
    app: server-postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
