apiVersion: batch/v1
kind: CronJob
metadata:
  name: notification-partition-maintenance
  namespace: bingebuddy-dev
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  schedule: "0 3 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: notification-partition-cron
        spec:
          restartPolicy: OnFailure
          containers:
            - name: psql
              image: postgres:15-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: notification-secrets
                      key: DB_PASSWORD
              command: ["psql", "-h", "notification-postgres", "-U", "admin", "-d", "notifications",
                        "-v", "ON_ERROR_STOP=1", "-c", "SELECT ensure_delivery_log_partitions(3);"]
