apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-postgres
  namespace: bingebuddy-dev
  labels:
    app: notification-postgres
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-postgres
  template:
    metadata:
      labels:
        app: notification-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: "notifications"
            - name: POSTGRES_USER
              value: "admin"
            - name: POSTGRES_PASSWORD
              value: "admin123"
          volumeMounts:
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: init-script
          configMap:
            name: notification-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: notification-postgres
  namespace: bingebuddy-dev
  labels:
    app: notification-postgres
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  selector:
    app: notification-postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
