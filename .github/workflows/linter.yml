name: Lint Code Base

# This triggers the action when a PR is opened against the 'development' branch
on:
  pull_request:
    branches: [ "development" ]

jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v5
        env:
          VALIDATE_ALL_CODEBASE: false # Only lints newly added/modified files
          DEFAULT_BRANCH: development
          VALIDATE_TYPESCRIPT_STANDARD: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}