name: Phase 3 CI/CD — AI Quality Gate

on:
  pull_request:
    branches:
      - development

permissions:
  contents: write
  issues: write

jobs:
  run-quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # fetch-depth 2 is enough to diff base vs head
          # fetch-depth 0 is broken in Git 2.50+ on ubuntu-latest
          fetch-depth: 2
          # Checkout the actual PR head — not the temp merge commit
          # GITHUB_SHA on pull_request events points to a merge commit
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch for diff
        # Explicitly fetch the base branch so git diff can reference it
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Initialize Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Execute quality gates
        working-directory: ./server
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          # Pass explicit SHAs — script never uses HEAD^1
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # exit(1) in the script blocks the PR merge here
        run: node scripts/ai-runner/generate-tests.js

      - name: Commit generated tests back to PR branch
        # Only runs if quality gates passed (step above did not exit 1)
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain server/tests/ai-generated)" ]; then
            git add server/tests/ai-generated/
            git commit -m "chore(testing): auto-generated verified unit tests [skip ci]"
            # Push to the PR head branch directly
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo "✅ Generated tests committed to PR branch."
          else
            echo "No new test files to commit."
          fi