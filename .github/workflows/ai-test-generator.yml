name: Phase 3 CI/CD Gatekeeper & Quality Engine

on:
  pull_request:
    branches:
      - development

permissions:
  contents: write
  issues: write

defaults:
  run:
    working-directory: ./server

jobs:
  run-quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so git diff tracks branches safely

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @google/genai --save-dev

      - name: Execute Quality Gates & Jira Orchestration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        # The orchestrator handles Jest natively. If a bug is found, it throws exit 1 here to block the PR.
        run: node scripts/ai-runner/generate-tests.js

      - name: Commit Approved Tests Back to PR Branch
        if: success()
        run: |
          cd ..
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain server/tests/ai-generated)" ]; then
            git add server/tests/ai-generated/
            git commit -m "chore(testing): auto-generated verified unit tests [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi