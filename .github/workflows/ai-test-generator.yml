name: Phase 1 AI Unit Test Generator (Monorepo TypeScript)

on:
  push:
    branches:
      - development

permissions:
  contents: write
  issues: write

defaults:
  run:
    working-directory: ./server

jobs:
  run-ai-tester:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json' # Exact lockfile location

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @google/genai --save-dev

      - name: Execute Diff Analysis & Generate Tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ai-runner/generate-tests.js

      - name: Run Global Test Suite
        run: npm test -- --passWithNoTests || true

      - name: Commit & Push Tests Back to Repository
        run: |
          cd ..
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check the entire tests/ directory for both new test suites and new Jira tickets
          if [ -n "$(git status --porcelain server/tests)" ]; then
            git add server/tests/
            git commit -m "chore(testing): auto-generated TypeScript unit tests & bug tickets [skip ci]"
            
            # Clear out runtime locks/node caches, keeping our new tests and tickets safe
            git reset --hard HEAD 
            
            git pull --rebase origin development
            git push origin development
          else
            echo "No new TypeScript testing artifacts generated to commit."
          fi